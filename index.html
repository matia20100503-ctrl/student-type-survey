<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학생 유형 설문</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f6fb;color:#202638}
header{background:#fff;border-bottom:1px solid #ddd;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
h1,h2,h3{margin-top:0}.brand{font-weight:800;font-size:20px}.wrap{max-width:900px;margin:30px auto;padding:0 18px}
.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 5px 22px #0000000d;margin-bottom:18px}
button{border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;background:#4255d4;color:#fff}
button.secondary{background:#e9ecf7;color:#27304d}button.danger{background:#e05252}
.hidden{display:none!important}.muted{color:#70778b}.progress{height:8px;background:#e8eaf1;border-radius:99px;overflow:hidden}.bar{height:100%;background:#4255d4;width:0}
.option{display:block;padding:15px;border:2px solid #e2e5ee;border-radius:12px;margin:10px 0;cursor:pointer}
.option:hover{border-color:#8793e5;background:#f7f8ff}.option input{margin-right:10px}
.result-type{font-size:34px;font-weight:900;margin:8px 0}.score{padding:12px;background:#f6f7fb;border-radius:10px;margin-top:10px}
input[type=text],textarea{width:100%;padding:12px;border:1px solid #d8dce7;border-radius:9px;font-size:15px}textarea{min-height:90px;resize:vertical}
.admin-item{border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1}
.small{font-size:13px}.tag{display:inline-block;padding:5px 9px;background:#eef0ff;border-radius:99px;color:#3d4cc1;font-size:12px;font-weight:bold}
</style>
</head>
<body>
<header><div class="brand">📊 학생 유형 설문</div><button class="secondary" onclick="showAdmin()">설문 관리</button></header>

<div class="wrap">
<section id="home" class="card">
<h1 id="homeTitle">나의 유형 알아보기</h1>
<p id="homeDesc" class="muted">몇 가지 질문에 답하고 나에게 해당하는 유형을 확인해 보세요.</p>
<button onclick="startSurvey()">설문 시작</button>
</section>

<section id="survey" class="card hidden">
<div class="small muted" id="qCount"></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<h2 id="question"></h2>
<div id="options"></div>
<div class="row"><button class="secondary" onclick="prevQ()">이전</button><button onclick="nextQ()">다음</button></div>
</section>

<section id="result" class="card hidden">
<span class="tag">설문 결과</span>
<div id="resultType" class="result-type"></div>
<p id="resultDesc"></p>
<h3>유형별 점수</h3><div id="scores"></div>
<h3 style="margin-top:24px">추천 후속 탐구</h3><div id="resultActivity"></div>
<br><button onclick="startSurvey()">다시 하기</button>
<button class="secondary" onclick="goHome()">처음으로</button>
</section>

<section id="admin" class="hidden">
<div class="tabs"><button onclick="adminTab('questions')">질문 관리</button><button onclick="adminTab('types')">유형 관리</button><button onclick="adminTab('settings')">설정</button></div>
<div id="adminQuestions" class="card"></div>
<div id="adminTypes" class="card hidden"></div>
<div id="adminSettings" class="card hidden"></div>
</section>
</div>

<script>
const DEFAULT={
title:"나의 유형 알아보기",
desc:"몇 가지 질문에 답하고 나에게 해당하는 유형을 확인해 보세요.",
questions:[
 {q:"새로운 문제가 생겼을 때 나는?",opts:[
  ["먼저 자료를 찾아본다","A"],["주변 사람의 의견을 듣는다","B"],["직접 여러 방법을 시도한다","C"],["충분히 생각한 뒤 행동한다","D"]]},
 {q:"모둠 활동에서 나는 주로?",opts:[
  ["자료를 조사한다","A"],["의견을 조율한다","B"],["직접 결과물을 만든다","C"],["전체 계획을 세운다","D"]]},
 {q:"잘 모르는 내용을 접했을 때?",opts:[
  ["관련 정보를 최대한 모은다","A"],["다른 사람에게 질문한다","B"],["일단 해보면서 익힌다","C"],["원리를 먼저 이해한다","D"]]},
 {q:"문제가 예상대로 풀리지 않을 때?",opts:[
  ["새로운 정보를 찾아본다","A"],["다른 사람과 해결책을 논의한다","B"],["방법을 바꿔 다시 시도한다","C"],["원인을 분석하고 계획을 수정한다","D"]]}
],
types:{
 A:{name:"탐구형",desc:"정보와 자료를 찾아 원인을 이해하려는 경향이 있습니다.",activity:"같은 주제에 대한 자료를 여러 출처에서 조사하고 근거의 차이를 비교해 보세요."},
 B:{name:"협력형",desc:"다른 사람의 의견을 듣고 조율하며 문제를 해결하는 경향이 있습니다.",activity:"친구들과 같은 문제를 논의하고 의견 차이가 어떻게 나타나는지 비교해 보세요."},
 C:{name:"실천형",desc:"직접 시도하고 경험하면서 해결책을 찾아가는 경향이 있습니다.",activity:"간단한 실험이나 실천 활동을 설계하고 실제 결과와 예상 결과를 비교해 보세요."},
 D:{name:"분석형",desc:"문제의 구조와 원인을 파악한 뒤 계획적으로 접근하는 경향이 있습니다.",activity:"하나의 문제를 원인-과정-결과로 나누어 분석하고 해결 방안을 제시해 보세요."}
}};

let data=load(), idx=0, answers=[];

function load(){try{return JSON.parse(localStorage.getItem("surveyData"))||structuredClone(DEFAULT)}catch(e){return structuredClone(DEFAULT)}}
function save(){localStorage.setItem("surveyData",JSON.stringify(data))}
function $(id){return document.getElementById(id)}
function hideAll(){["home","survey","result","admin"].forEach(x=>$(x).classList.add("hidden"))}
function goHome(){hideAll();$("home").classList.remove("hidden")}
function startSurvey(){idx=0;answers=[];hideAll();$("survey").classList.remove("hidden");renderQ()}
function renderQ(){
 let q=data.questions[idx]; $("qCount").textContent=`질문 ${idx+1} / ${data.questions.length}`;
 $("bar").style.width=((idx)/Math.max(1,data.questions.length))*100+"%";
 $("question").textContent=q.q; $("options").innerHTML="";
 q.opts.forEach((o,i)=>{
   let lab=document.createElement("label");lab.className="option";
   lab.innerHTML=`<input type="radio" name="answer" value="${o[1]}" ${answers[idx]===o[1]?"checked":""}> ${o[0]}`;
   $("options").appendChild(lab);
 });
}
function nextQ(){
 let sel=document.querySelector('input[name="answer"]:checked');
 if(!sel){alert("답변을 하나 선택해 주세요.");return}
 answers[idx]=sel.value;
 if(idx<data.questions.length-1){idx++;renderQ()}else showResult();
}
function prevQ(){if(idx>0){idx--;renderQ()}}
function showResult(){
 let scores={};Object.keys(data.types).forEach(k=>scores[k]=0);answers.forEach(a=>{if(scores[a]!=null)scores[a]++});
 let max=Math.max(...Object.values(scores)), winners=Object.keys(scores).filter(k=>scores[k]===max);
 let type=winners[0], t=data.types[type];
 hideAll();$("result").classList.remove("hidden");
 $("resultType").textContent=`${t.name} (${type}형)`;
 $("resultDesc").textContent=t.desc;
 $("resultActivity").textContent=t.activity;
 $("scores").innerHTML=Object.entries(scores).map(([k,v])=>`<div class="score"><b>${data.types[k].name}</b> — ${v}점</div>`).join("");
}

function showAdmin(){hideAll();$("admin").classList.remove("hidden");adminTab("questions")}
function adminTab(tab){
 ["questions","types","settings"].forEach(x=>$("admin"+x[0].toUpperCase()+x.slice(1)).classList.add("hidden"));
 $("admin"+tab[0].toUpperCase()+tab.slice(1)).classList.remove("hidden");
 if(tab==="questions")renderAdminQuestions();if(tab==="types")renderAdminTypes();if(tab==="settings")renderAdminSettings();
}
function renderAdminQuestions(){
 let h="<h2>질문 관리</h2><p class='muted'>질문, 선택지, 선택지별 유형을 수정할 수 있습니다.</p>";
 data.questions.forEach((q,qi)=>{
  h+=`<div class="admin-item"><b>질문 ${qi+1}</b><input type="text" value="${esc(q.q)}" oninput="data.questions[${qi}].q=this.value">`;
  q.opts.forEach((o,oi)=>h+=`<div class="row" style="margin-top:8px"><input type="text" value="${esc(o[0])}" oninput="data.questions[${qi}].opts[${oi}][0]=this.value"><select onchange="data.questions[${qi}].opts[${oi}][1]=this.value">${typeOptions(o[1])}</select></div>`);
  h+=`<br><button class="danger" onclick="removeQ(${qi})">이 질문 삭제</button></div>`;
 });
 h+=`<button onclick="addQ()">+ 질문 추가</button> <button onclick="save();alert('저장되었습니다.')">변경사항 저장</button> <button class="secondary" onclick="resetData()">기본값 복원</button>`;
 $("adminQuestions").innerHTML=h;
}
function typeOptions(selected){return Object.keys(data.types).map(k=>`<option value="${k}" ${k===selected?"selected":""}>${k} - ${data.types[k].name}</option>`).join("")}
function addQ(){let k=Object.keys(data.types);data.questions.push({q:"새 질문을 입력하세요.",opts:[["선택지 1",k[0]],["선택지 2",k[1]||k[0]]]});renderAdminQuestions()}
function removeQ(i){if(data.questions.length<=1)return alert("질문은 최소 1개가 필요합니다.");data.questions.splice(i,1);renderAdminQuestions()}
function renderAdminTypes(){
 let h="<h2>유형 관리</h2><p class='muted'>유형 이름, 설명, 후속 탐구 활동을 수정할 수 있습니다.</p>";
 Object.entries(data.types).forEach(([k,t])=>h+=`<div class="admin-item"><span class="tag">${k}형</span><input type="text" value="${esc(t.name)}" placeholder="유형 이름" oninput="data.types['${k}'].name=this.value"><br><br><textarea oninput="data.types['${k}'].desc=this.value">${esc(t.desc)}</textarea><br><br><textarea oninput="data.types['${k}'].activity=this.value">${esc(t.activity)}</textarea></div>`);
 h+=`<button onclick="save();alert('저장되었습니다.')">변경사항 저장</button>`;
 $("adminTypes").innerHTML=h;
}
function renderAdminSettings(){
 $("adminSettings").innerHTML=`<h2>설정</h2><label>사이트 제목</label><input type="text" value="${esc(data.title)}" oninput="data.title=this.value"><br><br><label>설명</label><textarea oninput="data.desc=this.value">${esc(data.desc)}</textarea><br><br><button onclick="save();applySettings();alert('저장되었습니다.')">변경사항 저장</button>`;
}
function applySettings(){$("homeTitle").textContent=data.title;$("homeDesc").textContent=data.desc}
function resetData(){if(confirm("모든 수정 내용을 기본값으로 되돌릴까요?")){data=structuredClone(DEFAULT);save();applySettings();renderAdminQuestions()}}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
applySettings();
</script>
</body>
</html>
